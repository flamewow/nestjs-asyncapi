name: code-quality

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: use node@20
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - name: 'install dependencies'
        run: npm ci
        env:
          PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: true
      - run: npm run lint
