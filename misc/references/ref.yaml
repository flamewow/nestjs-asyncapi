asyncapi: 3.0.0
info:
  title: Feline
  description: Feline server description here
  version: '1.0'
  contact: {}
  tags: []
servers:
  europe: &ref_0
    host: ws://0.0.0.0:4001
    protocol: socket.io
    protocolVersion: '4'
    description: >-
      Allows you to connect using the websocket protocol to our Socket.io
      server.
    security:
      - $ref: '#/components/securitySchemes/user-password'
    variables:
      port:
        description: Secure connection (TLS) is available through port 443.
        default: '443'
    bindings: {}
  asia: *ref_0
  north-america: *ref_0
  south-america: *ref_0
  africa: *ref_0
  australia: *ref_0
components:
  securitySchemes:
    user-password:
      type: userPassword
  schemas:
    Feline:
      type: object
      properties:
        id:
          type: number
        name:
          type: string
        age:
          type: number
        gender:
          enum: &ref_2
            - male
            - female
          type: string
        dominantPaw:
          enum: &ref_3
            - left
            - right
          type: string
        tags:
          type: array
          items:
            type: string
        birthDatetime:
          format: date-time
          type: string
      required:
        - id
        - name
        - age
        - gender
        - dominantPaw
        - tags
        - birthDatetime
    CreateFelineDto:
      type: object
      properties:
        correlationId:
          type: string
          format: uuid
        version:
          type: string
          format: x.y.z
          example: 1.0.1
        payload:
          additionalProperties: true
          oneOf:
            - $ref: '#/components/schemas/Cat'
            - $ref: '#/components/schemas/Lion'
            - $ref: '#/components/schemas/Tiger'
          allOf:
            - $ref: '#/components/schemas/Feline'
        timestamp:
          format: date-time
          type: string
      required:
        - correlationId
        - version
        - payload
        - timestamp
    FelineRto:
      type: object
      properties:
        correlationId:
          type: string
          format: uuid
        version:
          type: string
          format: x.y.z
          example: 1.0.1
        payload:
          additionalProperties: true
          oneOf: &ref_1
            - $ref: '#/components/schemas/Cat'
            - $ref: '#/components/schemas/Lion'
            - $ref: '#/components/schemas/Tiger'
        timestamp:
          format: date-time
          type: string
      required:
        - correlationId
        - version
        - payload
        - timestamp
    FelineExtendedRto:
      type: object
      properties:
        correlationId:
          type: string
          format: uuid
        version:
          type: string
          format: x.y.z
          example: 1.0.1
        payload:
          additionalProperties: true
          oneOf: *ref_1
        timestamp:
          format: date-time
          type: string
      required:
        - correlationId
        - version
        - payload
        - timestamp
    JournalingDataDto:
      type: object
      properties:
        correlationId:
          type: string
          format: uuid
        version:
          type: string
          format: x.y.z
          example: 1.0.1
        payload:
          type: object
          additionalProperties: true
        timestamp:
          format: date-time
          type: string
      required:
        - correlationId
        - version
        - payload
        - timestamp
    Cat:
      type: object
      properties:
        breed:
          type: string
          example: Maine Coon
        id:
          type: number
        name:
          type: string
        age:
          type: number
        gender:
          enum: *ref_2
          type: string
        dominantPaw:
          enum: *ref_3
          type: string
        tags:
          type: array
          items:
            type: string
        birthDatetime:
          format: date-time
          type: string
      required:
        - breed
        - id
        - name
        - age
        - gender
        - dominantPaw
        - tags
        - birthDatetime
    Lion:
      type: object
      properties:
        id:
          type: number
        name:
          type: string
        age:
          type: number
        gender:
          enum: *ref_2
          type: string
        dominantPaw:
          enum: *ref_3
          type: string
        tags:
          type: array
          items:
            type: string
        birthDatetime:
          format: date-time
          type: string
        roarVolume:
          type: number
      required:
        - id
        - name
        - age
        - gender
        - dominantPaw
        - tags
        - birthDatetime
        - roarVolume
    Tiger:
      type: object
      properties:
        id:
          type: number
        name:
          type: string
        age:
          type: number
        gender:
          enum: *ref_2
          type: string
        dominantPaw:
          enum: *ref_3
          type: string
        tags:
          type: array
          items:
            type: string
        birthDatetime:
          format: date-time
          type: string
        numberOfStripes:
          type: number
      required:
        - id
        - name
        - age
        - gender
        - dominantPaw
        - tags
        - birthDatetime
        - numberOfStripes
  messages:
    FelinesGateway_createFeline:
      name: FelinesGateway_createFeline
      payload:
        $ref: '#/components/schemas/CreateFelineDto'
    oneOf_demo_1:
      name: oneOf_demo_1
      payload:
        $ref: '#/components/schemas/FelineRto'
    oneOf_demo_2:
      name: oneOf_demo_2
      payload:
        $ref: '#/components/schemas/FelineExtendedRto'
    FelinesController_journal:
      name: FelinesController_journal
      payload:
        $ref: '#/components/schemas/JournalingDataDto'
    FelinesController_createFeline:
      name: FelinesController_createFeline
      payload:
        $ref: '#/components/schemas/FelineRto'
defaultContentType: application/json
channels:
  wsCreateFeline:
    address: ws/create/feline
    messages:
      FelinesGateway_createFeline:
        $ref: '#/components/messages/FelinesGateway_createFeline'
      oneOf_demo_1:
        $ref: '#/components/messages/oneOf_demo_1'
      oneOf_demo_2:
        $ref: '#/components/messages/oneOf_demo_2'
  msJournal:
    address: ms/journal
    messages:
      FelinesController_journal:
        $ref: '#/components/messages/FelinesController_journal'
  msCreateFeline:
    address: ms/create/feline
    messages:
      FelinesController_createFeline:
        $ref: '#/components/messages/FelinesController_createFeline'
operations:
  sendWsCreateFeline:
    action: send
    channel:
      $ref: '#/channels/wsCreateFeline'
    messages:
      - $ref: '#/channels/wsCreateFeline/messages/FelinesGateway_createFeline'
  receiveWsCreateFeline:
    action: receive
    channel:
      $ref: '#/channels/wsCreateFeline'
    messages:
      - $ref: '#/channels/wsCreateFeline/messages/oneOf_demo_1'
      - $ref: '#/channels/wsCreateFeline/messages/oneOf_demo_2'
  receiveMsJournal:
    action: receive
    channel:
      $ref: '#/channels/msJournal'
    messages:
      - $ref: '#/channels/msJournal/messages/FelinesController_journal'
  sendMsCreateFeline:
    action: send
    channel:
      $ref: '#/channels/msCreateFeline'
    messages:
      - $ref: '#/channels/msCreateFeline/messages/FelinesController_createFeline'
  receiveMsCreateFeline:
    action: receive
    channel:
      $ref: '#/channels/msCreateFeline'
    messages:
      - $ref: '#/channels/msCreateFeline/messages/FelinesController_createFeline'
